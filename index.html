const CATS = [...new Set(PRODUCTS.map(p=>p.cat))];
const fmt = n => '$' + n.toLocaleString('es-CO');

// ---------- STATE ----------
let activeCat = 'Todos';
let query = '';
let cart = {}; // id -> qty

// ---------- RENDER CHIPS ----------
const chipsEl = document.getElementById('chips');
function renderChips(){
  const all = ['Todos', ...CATS];
  chipsEl.innerHTML = all.map(c=>{
    const count = c==='Todos' ? PRODUCTS.length : PRODUCTS.filter(p=>p.cat===c).length;
    return `<button class="chip ${c===activeCat?'active':''}" data-cat="${c}">${c} <span class="count">${count}</span></button>`;
  }).join('');
  chipsEl.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeCat = btn.dataset.cat; renderChips(); renderGrid(); });
  });
}

// ---------- RENDER GRID ----------
const mainEl = document.getElementById('main');
function renderGrid(){
  const q = query.trim().toLowerCase();
  let filtered = PRODUCTS.filter(p=>{
    const matchCat = activeCat==='Todos' || p.cat===activeCat;
    const matchQ = !q || (p.name.toLowerCase()+' '+p.pres.toLowerCase()).includes(q);
    return matchCat && matchQ;
  });

  if(filtered.length===0){
    mainEl.innerHTML = `<div class="no-results">No encontramos productos para "${query}".<br>Prueba con otra palabra.</div>`;
    return;
  }

  // group by category, preserving CATS order
  const groups = {};
  filtered.forEach(p=>{ (groups[p.cat] = groups[p.cat]||[]).push(p); });

  let html = '';
  Object.keys(groups).forEach(cat=>{
    html += `<div class="cat-heading">${cat} <span class="tag">${groups[cat].length}</span></div>`;
    html += `<div class="grid">`;
    groups[cat].forEach(p=>{
      const qty = cart[p.id] || 0;
      html += `
        <div class="card" data-id="${p.id}">
          <div class="card-name">${p.name}</div>
          <div class="card-pres">${p.pres}</div>
          <div class="card-bottom">
            <div class="price">${fmt(p.price)}</div>
            ${qty===0
              ? `<button class="add-btn" data-add="${p.id}">Agregar</button>`
              : `<div class="stepper">
                   <button data-dec="${p.id}">−</button>
                   <div class="qty">${qty}</div>
                   <button data-inc="${p.id}">+</button>
                 </div>`
            }
          </div>
        </div>`;
    });
    html += `</div>`;
  });
  mainEl.innerHTML = html;

  mainEl.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.add, 1)));
  mainEl.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.inc, 1)));
  mainEl.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>changeQty(b.dataset.dec, -1)));
}

function changeQty(id, delta){
  const next = (cart[id]||0) + delta;
  if(next<=0){ delete cart[id]; } else { cart[id]=next; }
  renderGrid();
  renderCart();
}

// ---------- CART / DRAWER ----------
const cartFab = document.getElementById('cartFab');
const overlay = document.getElementById('overlay');
const drawer = document.getElementById('drawer');
const closeDrawer = document.getElementById('closeDrawer');
const cartCount = document.getElementById('cartCount');
const drawerItems = document.getElementById('drawerItems');
const drawerSub = document.getElementById('drawerSub');
const totalAmount = document.getElementById('totalAmount');
const sendBtn = document.getElementById('sendBtn');
const custName = document.getElementById('custName');
const custAddr = document.getElementById('custAddr');
const STORE_PHONE = '3136733551'; // WhatsApp de Tienda Lyan

function openDrawer(){ overlay.classList.add('open'); drawer.classList.add('open'); }
function closeDrawerFn(){ overlay.classList.remove('open'); drawer.classList.remove('open'); }
cartFab.addEventListener('click', openDrawer);
overlay.addEventListener('click', closeDrawerFn);
closeDrawer.addEventListener('click', closeDrawerFn);

function renderCart(){
  const ids = Object.keys(cart);
  const totalItems = ids.reduce((s,id)=>s+cart[id],0);
  const totalPrice = ids.reduce((s,id)=>{
    const p = PRODUCTS.find(x=>x.id===id);
    return s + p.price*cart[id];
  },0);

  cartCount.textContent = totalItems;
  drawerSub.textContent = `${totalItems} producto${totalItems===1?'':'s'}`;
  totalAmount.textContent = fmt(totalPrice);
  sendBtn.disabled = totalItems===0;

  if(ids.length===0){
    drawerItems.innerHTML = `<div class="drawer-empty">Tu libreta está vacía.<br>Agrega productos del catálogo.</div>`;
    return;
  }

  drawerItems.innerHTML = ids.map(id=>{
    const p = PRODUCTS.find(x=>x.id===id);
    const qty = cart[id];
    return `
      <div class="drawer-item">
        <div>
          <div class="di-name">${p.name}</div>
          <div class="di-pres">${p.pres} · x${qty}</div>
        </div>
        <div class="di-right">
          <div class="di-price">${fmt(p.price*qty)}</div>
          <button class="di-remove" data-remove="${id}">&times;</button>
        </div>
      </div>`;
  }).join('');

  drawerItems.querySelectorAll('[data-remove]').forEach(b=>{
    b.addEventListener('click', ()=>{ delete cart[b.dataset.remove]; renderGrid(); renderCart(); });
  });
}

sendBtn.addEventListener('click', ()=>{
  const ids = Object.keys(cart);
  if(ids.length===0) return;
  const name = custName.value.trim() || '(sin nombre)';
  const addr = custAddr.value.trim() || '(sin dirección)';

  let lines = [];
  lines.push(`*Pedido — Tienda Lyan*`);
  lines.push(`Cliente: ${name}`);
  lines.push(`Dirección: ${addr}`);
  lines.push('');
  let total = 0;
  ids.forEach(id=>{
    const p = PRODUCTS.find(x=>x.id===id);
    const qty = cart[id];
    const sub = p.price*qty;
    total += sub;
    lines.push(`• ${p.name} (${p.pres}) x${qty} — ${fmt(sub)}`);
  });
  lines.push('');
  lines.push(`*Total: ${fmt(total)}*`);

  const msg = encodeURIComponent(lines.join('\n'));
  const waNumber = '57' + STORE_PHONE;
  window.open(`https://wa.me/${waNumber}?text=${msg}`, '_blank');
});

// ---------- SEARCH ----------
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
searchInput.addEventListener('input', e=>{
  query = e.target.value;
  clearBtn.classList.toggle('show', query.length>0);
  renderGrid();
});
clearBtn.addEventListener('click', ()=>{
  query=''; searchInput.value=''; clearBtn.classList.remove('show'); renderGrid();
});

// ---------- ADMIN: PIN + PANEL ----------
// Cambia este PIN por el que quieras (4 dígitos). Es una protección básica de pantalla,
// no seguridad real: cualquiera que abra el código fuente del archivo puede verlo.
const ADMIN_PIN = '1234';

const adminLink = document.getElementById('adminLink');
const pinModal = document.getElementById('pinModal');
const pinInput = document.getElementById('pinInput');
const pinError = document.getElementById('pinError');
const pinCancel = document.getElementById('pinCancel');
const pinSubmit = document.getElementById('pinSubmit');
const adminPanel = document.getElementById('adminPanel');
const adminClose = document.getElementById('adminClose');
const adminSummary = document.getElementById('adminSummary');
const adminTable = document.getElementById('adminTable');

adminLink.addEventListener('click', ()=>{
  pinInput.value=''; pinError.textContent='';
  pinModal.classList.add('open');
  setTimeout(()=>pinInput.focus(), 50);
});
pinCancel.addEventListener('click', ()=> pinModal.classList.remove('open'));
pinModal.addEventListener('click', e=>{ if(e.target===pinModal) pinModal.classList.remove('open'); });
pinInput.addEventListener('keydown', e=>{ if(e.key==='Enter') pinSubmit.click(); });

pinSubmit.addEventListener('click', ()=>{
  if(pinInput.value === ADMIN_PIN){
    pinModal.classList.remove('open');
    renderAdmin();
    adminPanel.classList.add('open');
  } else {
    pinError.textContent = 'PIN incorrecto';
  }
});
adminClose.addEventListener('click', ()=> adminPanel.classList.remove('open'));

function renderAdmin(){
  let totalCost=0, totalPrice=0, totalProfit=0;
  const rows = [];
  CATS.forEach(cat=>{
    rows.push(`<tr class="cat-row"><td colspan="6">${cat}</td></tr>`);
    PRODUCTS.filter(p=>p.cat===cat).forEach(p=>{
      const profit = p.price - p.cost;
      const marginPct = ((profit / p.price) * 100).toFixed(1);
      const markupPct = ((profit / p.cost) * 100).toFixed(1);
      totalCost += p.cost; totalPrice += p.price; totalProfit += profit;
      rows.push(`
        <tr>
          <td class="name-col">${p.name}</td>
          <td>${p.pres}</td>
          <td>${fmt(p.cost)}</td>
          <td>${fmt(p.price)}</td>
          <td class="profit-pos">${fmt(profit)}</td>
          <td>${markupPct}% sobre costo</td>
        </tr>`);
    });
  });

  adminTable.innerHTML = `
    <thead><tr>
      <th>Producto</th><th>Presentación</th><th>Costo (compra)</th><th>Precio venta</th><th>Utilidad $</th><th>Utilidad %</th>
    </tr></thead>
    <tbody>${rows.join('')}</tbody>`;

  adminSummary.innerHTML = `
    <div class="stat"><div class="n">${PRODUCTS.length}</div><div class="l">Productos</div></div>
    <div class="stat"><div class="n">${fmt(totalCost)}</div><div class="l">Costo total inventario</div></div>
    <div class="stat"><div class="n">${fmt(totalPrice)}</div><div class="l">Valor venta total</div></div>
    <div class="stat"><div class="n">${fmt(totalProfit)}</div><div class="l">Utilidad total</div></div>
    <div class="stat"><div class="n">${((totalProfit/totalCost)*100).toFixed(1)}%</div><div class="l">Utilidad promedio sobre costo</div></div>
  `;
}

// ---------- INIT ----------
renderChips();
renderGrid();
renderCart();
